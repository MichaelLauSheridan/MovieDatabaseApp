<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <title>Movie Details</title>
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light">
    <a class="navbar-brand" th:href="@{/}">Movie DB</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/}">Home</a>
        <a class="nav-item nav-link" th:href="@{/movies}">Movies</a>
        <a class="nav-item nav-link" th:href="@{/add}">Add Movie</a>
        <a class="nav-item nav-link" th:href="@{/search}">Search</a>
    </div>
</nav>

<h1>Movie Details</h1>

<div>
    <p><strong>ID:</strong> <span th:text="${movie.id}"></span></p>
    <p><strong>Title:</strong> <span th:text="${movie.title}"></span></p>
    <p><strong>Genre:</strong> <span th:text="${movie.genre}"></span></p>
    <p><strong>Release Year:</strong> <span th:text="${movie.releaseYear}"></span></p>
    <p><strong>Rating:</strong> <span th:text="${movie.rating}"></span></p>
    <p><strong>Director:</strong> <span th:text="${movie.director}"></span></p>
    <p><strong>Duration (mins):</strong> <span th:text="${movie.durationMinutes}"></span></p>
</div>

<br/>
<a th:href="@{/movies}">Back to Movies</a> |
<a th:href="@{/}">Home</a>

</body>
</html>
