<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a> |
    <a th:href="@{/movies}">Movies</a> |
    <a th:href="@{/add}">Add Movie</a> |
    <a th:href="@{/search}">Search</a>
</nav>
<hr/>
    <h1> List of Movies </h1>
<table>
    <tr>
        <td>Id</td>
        <td>Title</td>
        <td>Genre</td>
        <td>Release Year</td>
        <td>Rating</td>
        <td>Director</td>
        <td>Duration(mins)</td>
    </tr>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}"></td>

        <td>
            <a th:href="@{/movies/{id}(id=${movie.id})}"
               th:text="${movie.title}"></a>
        </td>

        <td th:text="${movie.genre}"></td>
        <td th:text="${movie.releaseYear}"></td>
        <td th:text="${movie.rating}"></td>
        <td th:text="${movie.director}"></td>
        <td th:text="${movie.durationMinutes}"></td>

        <td>
            <a th:href="@{/movies/edit/{id}(id=${movie.id})}">Edit</a>
        </td>
        <td>
            <a th:href="@{/movies/delete/{id}(id=${movie.id})}">Delete</a>
        </td>
    </tr>
</table>
</body>
</html>
