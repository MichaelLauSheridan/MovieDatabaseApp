<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1> List of Movies </h1>
<table>
    <tr>
        <td>Id</td>
        <td>Title</td>
        <td>Genre</td>
        <td>Release Year</td>
        <td>Director</td>
        <td>Duration(mins)</td>
    </tr>
    <tr th:each="movie : ${movies}">
    <td th:text="${movie.id}"></td>
    <td th:text="${movie.title}"></td>
    <td th:text="${movie.genre}"></td>
    <td th:text="${movie.releaseYear}"></td>
    <td th:text="${movie.director}"></td>
    <td th:text="${movie.durationMinutes}"></td>
    </tr>
</table>
<a href="/">Home Page</a>
</body>
</html>
