<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<nav class="navbar navbar-expand navbar-light bg-light">
    <a class="navbar-brand" th:href="@{/}">Movie DB</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/}">Home</a>
        <a class="nav-item nav-link" th:href="@{/movies}">Movies</a>
        <a class="nav-item nav-link" th:href="@{/add}">Add Movie</a>
        <a class="nav-item nav-link" th:href="@{/search}">Search</a>
    </div>
</nav>
<hr/>
    <h1> List of Movies </h1>
<div class="container">
    <h1 class="mb-3">List of Movies</h1>

    <table class="table table-striped table-bordered">
        <tr>
            <th>Id</th>
            <th>Title</th>
            <th>Genre</th>
            <th>Release Year</th>
            <th>Rating</th>
            <th>Director</th>
            <th>Duration (mins)</th>
        </tr>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}"></td>

        <td>
            <a th:href="@{/movies/{id}(id=${movie.id})}"
               th:text="${movie.title}"></a>
        </td>

        <td th:text="${movie.genre}"></td>
        <td th:text="${movie.releaseYear}"></td>
        <td th:text="${movie.rating}"></td>
        <td th:text="${movie.director}"></td>
        <td th:text="${movie.durationMinutes}"></td>

        <td>
            <a th:href="@{/movies/edit/{id}(id=${movie.id})}">Edit</a>
        </td>
        <td>
            <a th:href="@{/movies/delete/{id}(id=${movie.id})}">Delete</a>
        </td>
    </tr>
</table>
</body>
</html>
