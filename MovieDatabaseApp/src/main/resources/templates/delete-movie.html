<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
          integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
          crossorigin="anonymous">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta charset="UTF-8">
    <title>Delete Movie</title>
</head>
<body>

<nav class="navbar navbar-expand navbar-light bg-light">
    <a class="navbar-brand" th:href="@{/}">Movie DB</a>
    <div class="navbar-nav">
        <a class="nav-item nav-link" th:href="@{/}">Home</a>
        <a class="nav-item nav-link" th:href="@{/movies}">Movies</a>
        <a class="nav-item nav-link" th:href="@{/add}">Add Movie</a>
        <a class="nav-item nav-link" th:href="@{/search}">Search</a>
    </div>
</nav>
<hr/>

<h1>Confirm Delete</h1>

<p>
    Are you sure you want to delete:
    <b th:text="${movie.title}"></b>
    (ID: <span th:text="${movie.id}"></span>) ?
</p>

<form th:action="@{/movies/delete/{id}(id=${movie.id})}" method="post">
    <button type="submit">Yes, Delete</button>
    <a th:href="@{/movies}">Cancel</a>
</form>

</body>
</html>
